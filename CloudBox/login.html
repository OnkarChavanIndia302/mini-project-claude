<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CloudBox Enterprise</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="auth-container">
        <div class="glass-card auth-box">
            <div class="brand-header">
                <span class="brand-icon">🔑</span>
                <h2>Welcome Back</h2>
                <p>Sign in to access your encrypted Cloud Storage</p>
            </div>
            <form id="loginForm">
                <div class="field-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="onkar@example.com" required />
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••••••" required />
                </div>
                <button type="submit" class="action-btn emerald-glow">Secure Login</button>
            </form>
            <div id="authStatus" class="auth-status"></div>
            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>
    <script>
        // 🟢 Live Render Backend URL Configured
        const BACKEND_URL = 'https://mini-project-claude.onrender.com';
        const form = document.getElementById('loginForm');
        const statusDiv = document.getElementById('authStatus');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            statusDiv.innerText = "Authenticating with MongoDB...";
            statusDiv.style.color = "#38bdf8";

            try {
                const res = await fetch(`${BACKEND_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('cloudbox_token', data.token);
                    localStorage.setItem('cloudbox_user', data.username);
                    statusDiv.innerText = `Welcome ${data.username}! Redirecting to Vault...`;
                    statusDiv.style.color = "#10b981";
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    throw new Error(data.error || "Login failed");
                }
            } catch (err) {
                statusDiv.innerText = err.message;
                statusDiv.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
