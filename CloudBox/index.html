<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBox | Secure Cloud Vault</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">CloudBox <strong>Vault</strong></span>
            </div>
            <div class="user-profile">
                <span id="userGreeting" class="status-badge">● Logged in</span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </header>

        <!-- Main Dashboard Layout -->
        <main class="dashboard-grid">
            
            <!-- Left Panel: File Selection & Direct MongoDB Store Option -->
            <section class="card upload-card">
                <h3>📁 Select File</h3>
                <div id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" hidden>
                    <div class="drop-zone-content">
                        <div class="drop-icon" style="font-size: 36px; margin-bottom: 8px;">☁️</div>
                        <p class="drop-title">Drag & drop your file here</p>
                        <p class="drop-sub">or <span class="browse-link" onclick="document.getElementById('fileInput').click()" style="color: #38bdf8; cursor: pointer; text-decoration: underline;">browse files</span></p>
                    </div>
                </div>

                <!-- Settings & Raw MongoDB Option -->
                <div class="options-group">
                    <div class="field" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;">
                        <label for="chunkSize" style="font-size: 13px; color: #cbd5e1;">Chunk Size:</label>
                        <select id="chunkSize">
                            <option value="256">256 KB (Recommended)</option>
                            <option value="64">64 KB (Small chunks)</option>
                            <option value="1024">1 MB (Fast upload)</option>
                        </select>
                    </div>

                    <!-- MongoDB Direct Raw Save Checkbox Option -->
                    <div class="field-checkbox" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #38bdf8; margin-top: 10px;">
                        <input type="checkbox" id="storePlainToMongo" style="accent-color: #06b6d4; width: 16px; height: 16px;">
                        <label for="storePlainToMongo">Store unencrypted raw file directly in MongoDB Atlas</label>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Processing Action Buttons -->
            <section class="card process-card">
                <h3>⚡ Action Pipeline</h3>
                <div class="action-buttons">
                    <button id="segmentBtn" class="btn btn-primary" disabled>
                        <span>⚡</span> 1. Segment File
                    </button>
                    <button id="encryptBtn" class="btn btn-warning" disabled>
                        <span>🔒</span> 2. Encrypt (AES-256)
                    </button>
                    <button id="uploadBtn" class="btn btn-success" disabled>
                        <span>☁️</span> 3. Upload File
                    </button>
                    <button id="decryptBtn" class="btn btn-info" disabled>
                        <span>🔓</span> 4. Decrypt & Download
                    </button>
                </div>
            </section>
        </main>

        <!-- Console Log Terminal -->
        <footer class="audit-terminal">
            <div class="terminal-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="terminal-title">Console Logs</span>
            </div>
            <div id="status" class="terminal-body">
                [SYSTEM READY] Select a file to start...
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
